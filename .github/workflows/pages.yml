name: Deploy static editor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  BASE_PATH: /${{ github.event.repository.name }}
  SITE_ORIGIN: https://${{ github.repository_owner }}.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Audit publishable files
        run: node scripts/audit-publication.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run check
      - name: Check Octopath II data and save roundtrips
        run: npm run test:unit
      - name: Build static files
        run: npm run build
      - name: Verify static entry points
        run: npm run check:static
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    # This account currently requires a public repository to enable Pages.
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
