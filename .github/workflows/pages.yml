name: Deploy static editor to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Audit publishable files
        run: node scripts/audit-publication.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run check
      - name: Read Pages URL and repository base path
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static files
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
      - name: Verify static entry points
        run: npm run check:static
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
